<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ляху Георгий - Портфолио</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">
    <!-- Кнопка переключения темы -->
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <span class="theme-toggle__icon">🌙</span>
    </button>

    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <h1 class="header__name" id="headerName">Ляху Георгий</h1>
            <p class="header__title" id="headerTitle">Разработчик AI, VR/AR/XR и Web</p>
        </div>
    </header>

    <!-- О себе -->
    <section class="section about">
        <div class="container">
            <h2 class="section__title">О себе</h2>
            <div class="about__content">
                <p class="about__bio" id="aboutBio"></p>
                <div class="about__specializations" id="specializations"></div>
                <div class="skills" id="skills"></div>
            </div>
        </div>
    </section>

    <!-- Опыт работы -->
    <section class="section experience">
        <div class="container">
            <h2 class="section__title">Опыт работы</h2>
            <div class="timeline" id="experience"></div>
        </div>
    </section>

    <!-- Проекты -->
    <section class="section projects">
        <div class="container">
            <h2 class="section__title">Проекты</h2>
            <div class="projects__grid" id="projects"></div>
        </div>
    </section>

    <!-- Контакты -->
    <section class="section contacts">
        <div class="container">
            <h2 class="section__title">Контакты</h2>
            <div class="contacts__list" id="contacts"></div>
        </div>
    </section>

    <!-- Подвал -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="currentYear"></span> Ляху Георгий</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
